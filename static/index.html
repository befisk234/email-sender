<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Sender</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 0.35rem;
    }

    .field { margin-bottom: 1.1rem; }

    input, textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #111;
      background: #fafafa;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #4f46e5;
      background: #fff;
    }

    textarea { resize: vertical; min-height: 120px; }

    button {
      width: 100%;
      padding: 0.7rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }

    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .message {
      margin-top: 1rem;
      padding: 0.65rem 0.9rem;
      border-radius: 6px;
      font-size: 0.875rem;
      display: none;
    }

    .message.success { background: #dcfce7; color: #166534; display: block; }
    .message.error   { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Send an Email</h1>
    <form id="emailForm">
      <div class="field">
        <label for="to">To</label>
        <input type="email" id="to" name="to" placeholder="recipient@example.com" required />
      </div>
      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Subject" required />
      </div>
      <div class="field">
        <label for="body">Body</label>
        <textarea id="body" name="body" placeholder="Write your message…" required></textarea>
      </div>
      <button type="submit" id="submitBtn">Send Email</button>
    </form>
    <div class="message" id="statusMsg"></div>
  </div>

  <script>
    const form = document.getElementById('emailForm');
    const btn  = document.getElementById('submitBtn');
    const msg  = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.className = 'message';
      msg.textContent = '';

      const payload = {
        to:      document.getElementById('to').value,
        subject: document.getElementById('subject').value,
        body:    document.getElementById('body').value,
      };

      try {
        const res = await fetch('/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = 'message success';
          msg.textContent = 'Email sent successfully!';
          form.reset();
        } else {
          msg.className = 'message error';
          msg.textContent = data.detail || 'Failed to send email.';
        }
      } catch {
        msg.className = 'message error';
        msg.textContent = 'Network error — please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Email';
      }
    });
  </script>
</body>
</html>
